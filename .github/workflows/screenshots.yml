name: Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "crates/perseid/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "scripts/screenshots.sh"
      - "scripts/check_screenshots.py"
      - "scripts/publish-screenshots.sh"
      - "scripts/test_publish_screenshots.py"
      - "scripts/test_check_screenshots.py"
      - ".github/workflows/screenshots.yml"
  # Do not path-filter pull requests at the workflow level. A workflow-level
  # skip leaves its checks pending, which blocks a PR when that workflow is
  # required. Detect relevant changes in a job instead; a skipped job completes
  # successfully.
  pull_request:

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      screenshots: ${{ steps.filter.outputs.screenshots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "screenshots=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "pull request base SHA is missing" >&2
            exit 1
          fi
          if git diff --quiet "$BASE_SHA"...HEAD -- \
            crates/perseid \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            scripts/screenshots.sh \
            scripts/check_screenshots.py \
            scripts/publish-screenshots.sh \
            scripts/test_publish_screenshots.py \
            scripts/test_check_screenshots.py \
            .github/workflows/screenshots.yml; then
            echo "screenshots=false" >> "$GITHUB_OUTPUT"
          else
            echo "screenshots=true" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    name: Generate and verify
    needs: changes
    if: needs.changes.outputs.screenshots == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux and Xvfb dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev \
            xvfb \
            xauth \
            libgl1-mesa-dri \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcursor1 \
            libxrandr2 \
            libxi6

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Test screenshot verifier
        run: python3 -m unittest discover -s scripts -p 'test_*screenshots.py'

      - name: Build with screenshot mode
        run: cargo build -p perseid --features screenshots --locked

      - name: Generate screenshots
        run: scripts/screenshots.sh --no-build --out artifacts/screenshots

      - name: Verify screenshots exist
        run: python3 scripts/check_screenshots.py artifacts/screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perseid-screenshots
          path: artifacts/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Add artifact link to the summary
        run: |
          {
            echo "## Perseid screenshots"
            echo
            echo "Generated from \`${{ github.sha }}\`."
            echo
            echo "[Download the PNG artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

  # Keep the write token in a separate job: the build and test steps above only
  # need contents: read. Fork pull
  # requests still get the artifact; their read-only token is never asked to
  # push or comment.
  publish:
    name: Publish screenshot gallery
    needs: screenshots
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download screenshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: perseid-screenshots
          path: artifacts/screenshots

      - name: Publish screenshot gallery
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export SCREENSHOTS_DIR="$PWD/artifacts/screenshots"
          export SCREENSHOTS_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          preview_sha="$(scripts/publish-screenshots.sh)"

          body_file="$(mktemp)"
          {
            echo "<!-- perseid-screenshots -->"
            echo "### Perseid screenshots"
            echo
            echo "Generated from \`${GITHUB_SHA}\` by the [Screenshots workflow](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) (attempt ${GITHUB_RUN_ATTEMPT})."
            echo
            echo "[View all screenshots in one page](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${preview_sha}/index.md)"
            echo
            echo "_If the gallery does not load, download the PNG artifacts from the workflow run._"
          } > "$body_file"

          if [[ -n "${PR_NUMBER:-}" ]]; then
            existing_id="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                --jq 'first(.[] | select(.body | contains("<!-- perseid-screenshots -->"))) | .id // empty'
            )"
            if [[ -n "$existing_id" ]]; then
              gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/issues/comments/${existing_id}" \
                -f body="$(cat "$body_file")" >/dev/null
            else
              gh api --method POST \
                "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
                -f body="$(cat "$body_file")" >/dev/null
            fi
          fi

          {
            cat "$body_file"
            echo
            echo "[Download the PNG artifacts](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}#artifacts)"
          } >> "$GITHUB_STEP_SUMMARY"

  demo_validation:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/demo-gif.yml
