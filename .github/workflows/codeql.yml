name: CodeQL

on:
  push:
    branches: [main]
  # Do not path-filter pull requests at the workflow level. A workflow-level
  # skip leaves its checks pending, which blocks a PR when that workflow is
  # required. Detect relevant changes in a job instead; a skipped job completes
  # successfully.
  pull_request:
  schedule:
    # Weekly full scan, in addition to every push to main.
    - cron: "37 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BASE_SHA" ]]; then
            echo "pull request base SHA is missing" >&2
            exit 1
          fi
          # Include this workflow so CodeQL configuration changes exercise the
          # Rust job.
          if git diff --quiet "$BASE_SHA"...HEAD -- \
            crates \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain.toml \
            .cargo \
            .github/workflows/codeql.yml; then
            echo "rust=false" >> "$GITHUB_OUTPUT"
          else
            echo "rust=true" >> "$GITHUB_OUTPUT"
          fi

  # Actions and Python scans are cheap enough to keep on every pull request.
  analyze-other:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"

  # Pull requests run a lighter suite over the whole Rust codebase. The full
  # default suite runs after every push to main, weekly, and on manual dispatch.
  # The PR suite excludes path-problem queries (including injection and sensitive
  # data-flow checks); those findings will only be reported by the full scans.
  # Expensive diagnostic/summary queries are also excluded where CodeQL permits;
  # full scans retain diagnostics used to assess extraction quality.
  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # CodeQL's Rust extractor requires rustup and cargo on the runner.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - name: Initialize CodeQL (pull request, reduced)
        if: github.event_name == 'pull_request'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          config: |
            query-filters:
              - exclude:
                  kind: path-problem
              - exclude:
                  id: /rust\/(diagnostics|diagnostic|summary|telemetry)\//

      - name: Initialize CodeQL (full)
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust
