name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml keeps local builds to two jobs. CI runners can use four.
  CARGO_BUILD_JOBS: 4

jobs:
  checks:
    name: Checks (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Each platform is an independent status check and starts in parallel.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          # GitHub's standard macos-15 hosted runner is Apple Silicon (arm64).
          - os: macos-15
            name: macOS (Apple Silicon)
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

      - name: Check packaging
        run: cargo package --workspace --allow-dirty --locked

  # Keep the status-check name required by the repository ruleset. This gate
  # succeeds only after every parallel platform job has succeeded.
  required-check:
    name: Format, lint, test
    if: always()
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all platform checks
        env:
          PLATFORM_CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$PLATFORM_CHECKS_RESULT" != "success" ]]; then
            echo "Platform checks finished with: $PLATFORM_CHECKS_RESULT" >&2
            exit 1
          fi
