[package]
name = "perseid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight web security workbench for inspecting, modifying, and replaying HTTP traffic"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["http", "proxy", "security", "egui", "burp"]
categories = ["gui", "network-programming", "development-tools::testing"]

[lib]
name = "perseid"
path = "src/lib.rs"

[[bin]]
name = "perseid"
path = "src/main.rs"

[features]
# Development-only mode that renders the documentation screenshots headlessly.
screenshots = []
# Enables the main-thread AppKit integration test used by coverage CI.
native-menu-test = []

[[test]]
name = "native_macos_menu"
path = "tests/native_macos_menu.rs"
harness = false
required-features = ["native-menu-test"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[dependencies]
base64 = "0.23"
bytes.workspace = true
blake2 = "0.11"
blake3 = "1"
brotli-decompressor.workspace = true
chrono.workspace = true
clap.workspace = true
digest = "0.11"
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
flate2.workspace = true
form_urlencoded.workspace = true
html-escape = "0.3"
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
md-5 = "0.11"
redb = "4.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md2 = "0.11"
md4 = "0.11"
num-bigint = "0.5"
rcgen.workspace = true
regex.workspace = true
ripemd = "0.2"
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
similar.workspace = true
sm3 = "0.5"
thiserror.workspace = true
tiger = "0.3"
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }
tokio-rustls.workspace = true
webpki-roots.workspace = true
whirlpool = "0.11"
