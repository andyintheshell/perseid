[package]
name = "perseid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight web security workbench for inspecting, modifying, and replaying HTTP traffic"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["http", "proxy", "security", "egui", "burp"]
categories = ["gui", "network-programming", "development-tools::testing"]

[lib]
name = "perseid"
path = "src/lib.rs"

[[bin]]
name = "perseid"
path = "src/main.rs"

[features]
# Development-only mode that renders the documentation screenshots headlessly.
screenshots = []

[dependencies]
base64 = "0.23"
bytes.workspace = true
blake2 = "0.10"
blake3 = "1"
brotli-decompressor.workspace = true
chrono.workspace = true
clap.workspace = true
digest = "0.10"
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
flate2.workspace = true
form_urlencoded.workspace = true
html-escape = "0.2"
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
md-5 = "0.10"
md2 = "0.10"
md4 = "0.10"
num-bigint = "0.5"
rcgen.workspace = true
regex.workspace = true
ripemd = "0.2"
rustls.workspace = true
rustls-native-certs.workspace = true
rustls-pemfile.workspace = true
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
thiserror.workspace = true
tiger = "0.2"
tokio.workspace = true
tokio-rustls.workspace = true
webpki-roots.workspace = true
whirlpool = "0.10"
