[package]
name = "perseid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight web security workbench for inspecting, modifying, and replaying HTTP traffic"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["http", "proxy", "security", "egui", "burp"]
categories = ["gui", "network-programming", "development-tools::testing"]

[[bin]]
name = "perseid"
path = "src/main.rs"

[features]
# Development-only mode that renders the documentation screenshots headlessly.
screenshots = []

[dependencies]
base64 = "0.23"
blake2 = "0.10"
blake3 = "1"
brotli-decompressor.workspace = true
chrono.workspace = true
clap.workspace = true
digest = "0.10"
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
flate2.workspace = true
form_urlencoded.workspace = true
html-escape = "0.2"
image.workspace = true
libc.workspace = true
log.workspace = true
md-5 = "0.10"
md2 = "0.10"
md4 = "0.10"
num-bigint = "0.4"
perseid-proxy = { version = "0.1.0", path = "../perseid-proxy" }
ripemd = "0.1"
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
sm3 = "0.4"
tiger = "0.2"
whirlpool = "0.10"
