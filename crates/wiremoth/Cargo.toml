[package]
name = "wiremoth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A lightweight, keyboard-first workbench for inspecting HTTP traffic"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["http", "proxy", "security", "egui", "burp"]
categories = ["gui", "network-programming", "development-tools::testing"]

[[bin]]
name = "wiremoth"
