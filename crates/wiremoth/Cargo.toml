[dependencies]
chrono.workspace = true
clap.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
env_logger.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
wiremoth-proxy = { version = "0.1.0", path = "../wiremoth-proxy" }
