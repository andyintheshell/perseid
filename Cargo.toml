[workspace]
resolver = "2"
members = [
    "crates/wiremoth",
    "crates/wiremoth-proxy",
]
default-members = ["crates/wiremoth"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wiremoth/wiremoth"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
egui = "0.37"
egui_extras = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
env_logger = "0.11"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "tokio",
] }
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
