[workspace]
resolver = "2"
members = ["crates/perseid"]

[workspace.package]
version = "0.3.0-dev"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/andyintheshell/perseid"
homepage = "https://github.com/andyintheshell/perseid"

[workspace.dependencies]
brotli-decompressor = "6.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
egui = "0.37"
egui_extras = "0.37"
eframe = { version = "0.37", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "wayland",
    "x11",
] }
env_logger = "0.11"
flate2 = "1.1"
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "http1",
    "http2",
    "logging",
    "native-tokio",
    "ring",
    "tls12",
] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "server-auto",
    "tokio",
] }
rcgen = { version = "0.14", default-features = false, features = [
    "crypto",
    "pem",
    "ring",
] }
rustls = { version = "0.23", default-features = false, features = [
    "logging",
    "ring",
    "std",
    "tls12",
] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
similar = { version = "2.7", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
webpki-roots = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
libc = "0.2"
log = "0.4"
regex = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }

# Keep build artifacts and linker memory small on resource-constrained machines.
# `test` inherits `dev` and `bench` inherits `release`. To debug a one-off build
# with full debug info, override the profile setting from the environment, e.g.
# `CARGO_PROFILE_DEV_DEBUG=2 cargo build` or `CARGO_PROFILE_TEST_DEBUG=2 cargo test`.
[profile.dev]
debug = 0

[profile.release]
debug = 0
