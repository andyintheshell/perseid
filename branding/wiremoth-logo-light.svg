<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<title>Wiremoth logo</title>
<rect width="1200" height="320" fill="#F7F3EC"/>
<g transform="translate(23 15) scale(0.56)">
<!-- Angular wings, like packets branching from a live wire. Distinct from Burp's lightning insignia. -->
<g fill="#FF7542">
 <path d="M238 226 L160 125 Q155 119 148 123 L73 164 Q66 168 71 180 L109 265 Q112 272 121 272 L215 251 Z"/>
</g>
<g transform="translate(512 0) scale(-1 1)" fill="#FF9250">
 <path d="M238 226 L160 125 Q155 119 148 123 L73 164 Q66 168 71 180 L109 265 Q112 272 121 272 L215 251 Z"/>
</g>
<g fill="#DF5537">
 <path d="M226 278 L176 283 Q170 284 167 290 L135 354 Q131 365 146 368 L202 362 Q212 361 217 351 L243 310 Z"/>
</g>
<g transform="translate(512 0) scale(-1 1)" fill="#FF7742">
 <path d="M226 278 L176 283 Q170 284 167 290 L135 354 Q131 365 146 368 L202 362 Q212 361 217 351 L243 310 Z"/>
</g>
<!-- Negative-space circuit traces running along the wings -->
<path d="M110 184 L157 206 L189 237" stroke="#141A22" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
<path d="M402 184 L355 206 L323 237" stroke="#141A22" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
<path d="M156 342 L196 322" stroke="#141A22" stroke-width="12" fill="none"/>
<path d="M356 342 L316 322" stroke="#141A22" stroke-width="12" fill="none"/>
<!-- Antennae terminate like endpoints on a circuit -->
<path d="M251 209 L225 174 L217 151" stroke="#F7F3EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M261 209 L287 174 L295 151" stroke="#F7F3EC" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<circle cx="214" cy="143" r="7" fill="#FF9250"/>
<circle cx="298" cy="143" r="7" fill="#FF9250"/>
<!-- Single continuous vertical signal/body -->
<circle cx="256" cy="220" r="15" fill="#F7F3EC"/>
<path d="M249 237 L243 260 L252 324 Q256 339 260 324 L269 260 L263 237Z" fill="#F7F3EC"/>
</g>
<text x="321" y="194" fill="#141A22" font-size="94" font-family="Inter, Inter Display, DejaVu Sans, sans-serif" font-weight="700" letter-spacing="-3">wiremoth</text>
<text x="327" y="244" fill="#65717C" font-size="20" font-family="Inter, Inter Display, sans-serif" font-weight="500" letter-spacing="4.7">INSPECT THE WIRE.</text>
</svg>